# iOS derlemesi (imzasız), GitHub'ın macOS makinesinde: Mac olmadan Swift
# tarafını (app/ios/Runner, app/ios/Indirici) derleyip hataları gösterir.
# Depo herkese açık olduğu için ücretsiz. Hatalar özet sayfasında da yazılır
# (giriş yapmadan okunur).
name: iOS derleme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'app/lib/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'tools/icerik_esitle.dart'
      - '.github/workflows/ios.yml'

jobs:
  derle:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Araç sürümleri
        run: |
          xcodebuild -version
          xcrun --find ba-package

      - name: İçerik
        run: dart run tools/icerik_esitle.dart

      - name: Derle (imzasız)
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: Hatalar özet olarak
        if: failure()
        working-directory: app
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|Error:|error \(|Cycle" build.log | head -40 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -40 build.log > errors.txt; fi
          body=$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=iOS derleme::${body}"

      - name: Uygulama boyutu ve eklenti
        working-directory: app
        run: |
          du -sh build/ios/iphoneos/Runner.app
          ls -la build/ios/iphoneos/Runner.app/Extensions
          plutil -p build/ios/iphoneos/Runner.app/Extensions/Indirici.appex/Info.plist
