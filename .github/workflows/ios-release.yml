# iOS uygulamasını imzalayıp App Store Connect'e (TestFlight) yükler; Mac
# olmadığı için GitHub'ın macOS makinesinde. Elle çalıştırılır (Actions →
# iOS yayın → Run workflow). Kurulum ve secret'lar: magaza/APP_STORE.md.
#
# İmza elle (dağıtım sertifikası + iki App Store profili: uygulama ve
# bölüm paketi indirici eklentisi), Xcode'un otomatik imzası değil: temiz
# makinede anahtarlık yok, otomatik imza her seferinde yeni sertifika üretir.
#
# Secret'lar:
#   APPLE_TEAM_ID           10 karakterlik Team ID
#   IOS_DIST_CERT_P12       dağıtım sertifikasının (.p12) base64'ü
#   IOS_DIST_CERT_PASSWORD  parolası
#   IOS_PROFILE             com.yerdema.siyer App Store profilinin base64'ü
#   IOS_PROFILE_INDIRICI    com.yerdema.siyer.indirici App Store profilinin base64'ü
#   ASC_KEY_ID              App Store Connect API anahtarı kimliği
#   ASC_ISSUER_ID           Issuer ID
#   ASC_KEY_P8              anahtar dosyasının metni (-----BEGIN PRIVATE KEY-----)
name: iOS yayın

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: 'Derleme numarası (boş: pubspec.yaml’daki +N)'
        required: false
        default: ''
      upload:
        description: 'App Store Connect’e yükle'
        type: boolean
        default: true

jobs:
  yayin:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
      IOS_PROFILE_INDIRICI: ${{ secrets.IOS_PROFILE_INDIRICI }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Secret'ları denetle
        run: |
          eksik=""
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROFILE IOS_PROFILE_INDIRICI; do
            [ -n "${!name}" ] || eksik="$eksik $name"
          done
          if [ "${{ inputs.upload }}" = "true" ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
              [ -n "${!name}" ] || eksik="$eksik $name"
            done
          fi
          if [ -n "$eksik" ]; then
            echo "::error title=Eksik secret::$eksik"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: İçerik
        run: dart run tools/icerik_esitle.dart

      - name: Sertifika ve profiller
        run: |
          keychain="$RUNNER_TEMP/imza.keychain-db"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          kur() {  # $1: base64 profil, $2: ortam değişkeni adı
            local dosya="$RUNNER_TEMP/$2.mobileprovision"
            echo "$1" | base64 --decode > "$dosya"
            security cms -D -i "$dosya" > "$RUNNER_TEMP/$2.plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$2.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$2.plist")
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$dosya" "$dir/$uuid.mobileprovision"
            done
            echo "$2=$name" >> "$GITHUB_ENV"
            echo "Profil: $name ($uuid)"
          }
          kur "$IOS_PROFILE" PROFIL_UYGULAMA
          kur "$IOS_PROFILE_INDIRICI" PROFIL_INDIRICI

      # Release.xcconfig yalnız Runner hedefinin, Indirici.xcconfig yalnız
      # eklentinin temelidir; Swift paketlerinden profil istenmez.
      - name: İmza ayarları
        run: |
          imza() {  # $1: xcconfig, $2: profil adı
            {
              echo "CODE_SIGN_STYLE=Manual"
              echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
              echo "CODE_SIGN_IDENTITY=Apple Distribution"
              echo "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution"
              echo "PROVISIONING_PROFILE_SPECIFIER=$2"
            } >> "$1"
          }
          imza app/ios/Flutter/Release.xcconfig "$PROFIL_UYGULAMA"
          imza app/ios/Indirici/Indirici.xcconfig "$PROFIL_INDIRICI"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.yerdema.siyer</key><string>$PROFIL_UYGULAMA</string>
              <key>com.yerdema.siyer.indirici</key><string>$PROFIL_INDIRICI</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: IPA derle
        working-directory: app
        run: |
          set -o pipefail
          number="${{ inputs.build-number }}"
          flutter pub get
          flutter build ipa --release --obfuscate --split-debug-info=build/semboller \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            ${number:+--build-number=$number} 2>&1 | tee build.log
          ls -la build/ios/ipa

      - name: Hatalar özet olarak
        if: failure()
        working-directory: app
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|Error:|error \(" build.log | head -40 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -40 build.log > errors.txt; fi
          body=$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=iOS yayın::${body}"

      - name: App Store Connect'e yükle
        if: inputs.upload
        working-directory: app
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: IPA ve Dart sembollerini sakla
        uses: actions/upload-artifact@v4
        with:
          name: siyer-ipa
          path: |
            app/build/ios/ipa/*.ipa
            app/build/semboller/
          retention-days: 14

      - name: Temizlik
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/imza.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$HOME/.appstoreconnect/private_keys/"*.p8
